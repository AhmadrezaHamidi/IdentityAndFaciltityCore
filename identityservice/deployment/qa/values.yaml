app:
  version: latest
  port: 50013
  protocol: TCP

replicaCount: 1

image:
  repository: 172.19.29.18:8082/omidboom/omidbank/qa/identity-service-api
  pullPolicy: IfNotPresent
  command: ""
  args: ""

env:
  fromConfigmap:
    enabled: true
    data: {}

  fromSecret:
    ***
    data: {}

restartPolicy: Always

imagePullSecrets:
  ***

nameOverride: "identity-service-api"
fullnameOverride: ""

serviceMonitor:
  enabled: false
  namespace: monitoring
  interval: 10s
  scrapeTimeout: 10s
  selector:
    prometheus: kube-prometheus
    release: prometheus

readinessProbe:
  enabled: false
  path: "/health"
  initialDelaySeconds: 10
  periodSeconds: 20
  failureThreshold: 3
  timeoutSeconds: 5

livenessProbe:
  enabled: false
  path: "/health"
  initialDelaySeconds: 10
  periodSeconds: 30
  failureThreshold: 3
  timeoutSeconds: 5

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 50013

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
