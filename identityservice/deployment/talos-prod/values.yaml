# talos-prod values — GitOps deploy of identity-service-api into the "omidbank" namespace of the
# Talos/vSphere prod cluster (talos-vsphere repo, terraform/environments/prod), synced by
# ArgoCD Application "identity-service-api". app.version is bumped by the sync-talos-prod CI job on every
# X.Y.Z-staging tag. Env config below is flattened from appsettings.Development.json merged
# with appsettings.Qa.json (Qa wins) because the image runs ASPNETCORE_ENVIRONMENT=Staging and
# no appsettings.Staging.json exists — every env-specific key must arrive as an env var
# (nested keys use "__"). Review endpoints before go-live: old-infra IPs need firewall rules
# (see talos-vsphere docs/NETWORK-TEAM-FIREWALL-REQUEST-OMIDBANK-STAGING.md) and in-cluster
# service names resolve only once the referenced sibling service is onboarded too.
