service:
  type: ClusterIP
  port: 50013

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# MUST stay {} on chart 0.1.0: a non-empty nodeSelector activates a "with" block in
# templates/deployment.yaml that dereferences .Values.restartPolicy under a rescoped dot
# (nil pointer -> template error). Compute pool is still targeted implicitly because the
# storage and ingress pools are tainted.
nodeSelector: {}

tolerations: []

affinity: {}
